<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <style>
      .title { font: 700 16px 'Plus Jakarta Sans', Arial, sans-serif; fill: #0f172a; }
      .sub { font: 500 11px 'Plus Jakarta Sans', Arial, sans-serif; fill: #475569; }
      .panelTitle { font: 800 14px 'Plus Jakarta Sans', Arial, sans-serif; fill: #1e3a8a; }
      .lbl { font: 600 11.5px 'Plus Jakarta Sans', Arial, sans-serif; fill: #334155; }
    </style>
  </defs>
  <rect width="640" height="360" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="320" y="28" text-anchor="middle" class="title">Mekanisme Pernapasan Manusia (Inspirasi &amp; Ekspirasi)</text>
  <text x="320" y="45" text-anchor="middle" class="sub">Bandingkan posisi tulang rusuk, volume paru-paru, dan lengkungan diafragma pada Gambar A dan Gambar B</text>

  <!-- GAMBAR A: INSPIRASI -->
  <g transform="translate(24, 62)">
    <rect width="286" height="278" rx="14" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
    <text x="143" y="26" text-anchor="middle" class="panelTitle">Gambar A (Udara Masuk)</text>

    <!-- Trakea & panah masuk -->
    <rect x="135" y="44" width="16" height="44" fill="#cbd5e1" stroke="#475569" stroke-width="1.8"/>
    <line x1="143" y1="36" x2="143" y2="70" stroke="#0284c7" stroke-width="3.5"/>
    <polygon points="143,76 137,65 149,65" fill="#0284c7"/>

    <!-- Paru-paru mengembang besar -->
    <path d="M133,86 C90,88 68,130 68,182 C68,214 96,222 130,214 Z" fill="#fda4af" stroke="#e11d48" stroke-width="2.2"/>
    <path d="M153,86 C196,88 218,130 218,182 C218,214 190,222 156,214 Z" fill="#fda4af" stroke="#e11d48" stroke-width="2.2"/>

    <!-- Panah dada mengembang keluar -->
    <line x1="76" y1="154" x2="48" y2="154" stroke="#0284c7" stroke-width="2.5"/>
    <polygon points="44,154 53,149 53,159" fill="#0284c7"/>
    <line x1="210" y1="154" x2="238" y2="154" stroke="#0284c7" stroke-width="2.5"/>
    <polygon points="242,154 233,149 233,159" fill="#0284c7"/>

    <!-- Diafragma datar (berkontraksi) -->
    <path d="M62,232 Q143,238 224,232" fill="none" stroke="#ea580c" stroke-width="7" stroke-linecap="round"/>
    <line x1="143" y1="218" x2="143" y2="248" stroke="#ea580c" stroke-width="2.5"/>
    <polygon points="143,254 137,245 149,245" fill="#ea580c"/>

    <text x="143" y="268" text-anchor="middle" class="lbl">Diafragma mendatar • Rongga dada membesar</text>
  </g>

  <!-- GAMBAR B: EKSPIRASI -->
  <g transform="translate(330, 62)">
    <rect width="286" height="278" rx="14" fill="#ffffff" stroke="#fecdd3" stroke-width="2"/>
    <text x="143" y="26" text-anchor="middle" class="panelTitle" style="fill:#be123c">Gambar B (Udara Keluar)</text>

    <!-- Trakea & panah keluar -->
    <rect x="135" y="44" width="16" height="44" fill="#cbd5e1" stroke="#475569" stroke-width="1.8"/>
    <line x1="143" y1="74" x2="143" y2="40" stroke="#dc2626" stroke-width="3.5"/>
    <polygon points="143,34 137,45 149,45" fill="#dc2626"/>

    <!-- Paru-paru mengempis -->
    <path d="M133,92 C104,95 88,130 88,172 C88,196 106,204 130,198 Z" fill="#fecdd3" stroke="#e11d48" stroke-width="2.2"/>
    <path d="M153,92 C182,95 198,130 198,172 C198,196 180,204 156,198 Z" fill="#fecdd3" stroke="#e11d48" stroke-width="2.2"/>

    <!-- Panah dada mengecil ke dalam -->
    <line x1="50" y1="154" x2="78" y2="154" stroke="#dc2626" stroke-width="2.5"/>
    <polygon points="82,154 73,149 73,159" fill="#dc2626"/>
    <line x1="236" y1="154" x2="208" y2="154" stroke="#dc2626" stroke-width="2.5"/>
    <polygon points="204,154 213,149 213,159" fill="#dc2626"/>

    <!-- Diafragma melengkung ke atas (relaksasi) -->
    <path d="M68,236 Q143,195 218,236" fill="none" stroke="#ea580c" stroke-width="7" stroke-linecap="round"/>
    <line x1="143" y1="242" x2="143" y2="216" stroke="#ea580c" stroke-width="2.5"/>
    <polygon points="143,210 137,219 149,219" fill="#ea580c"/>

    <text x="143" y="268" text-anchor="middle" class="lbl">Diafragma melengkung • Rongga dada mengecil</text>
  </g>
</svg>
