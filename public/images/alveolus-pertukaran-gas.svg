<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340">
  <defs>
    <style>
      .title { font: 700 16px 'Plus Jakarta Sans', Arial, sans-serif; fill: #0f172a; }
      .sub { font: 500 11px 'Plus Jakarta Sans', Arial, sans-serif; fill: #475569; }
      .lbl { font: 700 12px 'Plus Jakarta Sans', Arial, sans-serif; fill: #0f172a; }
      .gas-o2 { font: 800 14px 'Plus Jakarta Sans', Arial, sans-serif; fill: #0284c7; }
      .gas-co2 { font: 800 14px 'Plus Jakarta Sans', Arial, sans-serif; fill: #dc2626; }
    </style>
  </defs>
  <rect width="600" height="340" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="300" y="30" text-anchor="middle" class="title">Proses Pertukaran Gas pada Gelembung Alveolus</text>
  <text x="300" y="48" text-anchor="middle" class="sub">Perhatikan arah panah gas O₂ dan CO₂ antara rongga alveolus dan pembuluh kapiler darah</text>

  <!-- Gelembung Alveolus -->
  <path d="M250,75 L250,118 C200,125 180,175 198,218 C215,256 262,268 300,256 C338,268 385,256 402,218 C420,175 400,125 350,118 L350,75"
        fill="#ffe4e6" stroke="#e11d48" stroke-width="3"/>
  <text x="300" y="156" text-anchor="middle" class="lbl">Rongga Alveolus</text>

  <!-- Pembuluh Kapiler Darah di bawah Alveolus -->
  <path d="M70,292 C160,292 220,278 300,278 C380,278 440,292 530,292" fill="none" stroke="#b91c1c" stroke-width="28" stroke-linecap="round"/>
  <path d="M70,292 C160,292 220,278 300,278 C380,278 440,292 530,292" fill="none" stroke="#ef4444" stroke-width="20" stroke-linecap="round"/>

  <!-- Sel darah merah -->
  <ellipse cx="140" cy="291" rx="12" ry="7" fill="#991b1b"/>
  <ellipse cx="245" cy="281" rx="12" ry="7" fill="#991b1b"/>
  <ellipse cx="355" cy="281" rx="12" ry="7" fill="#dc2626" stroke="#fca5a5" stroke-width="1.5"/>
  <ellipse cx="460" cy="291" rx="12" ry="7" fill="#dc2626" stroke="#fca5a5" stroke-width="1.5"/>

  <!-- Panah O2 masuk dari alveolus ke darah -->
  <line x1="255" y1="190" x2="255" y2="262" stroke="#0284c7" stroke-width="4"/>
  <polygon points="255,270 247,256 263,256" fill="#0284c7"/>
  <text x="234" y="226" text-anchor="end" class="gas-o2">O₂</text>

  <!-- Panah CO2 keluar dari darah ke alveolus -->
  <line x1="345" y1="266" x2="345" y2="196" stroke="#dc2626" stroke-width="4"/>
  <polygon points="345,186 337,200 353,200" fill="#dc2626"/>
  <text x="364" y="226" text-anchor="start" class="gas-co2">CO₂</text>

  <!-- Arah udara di bronkiolus -->
  <text x="300" y="96" text-anchor="middle" class="lbl">Udara Masuk (O₂) / Keluar (CO₂)</text>
  <text x="115" y="325" text-anchor="middle" class="lbl">Darah Kaya CO₂</text>
  <text x="485" y="325" text-anchor="middle" class="lbl">Darah Kaya O₂</text>
</svg>
