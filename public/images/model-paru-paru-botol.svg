<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360">
  <defs>
    <style>
      .title { font: 700 16px 'Plus Jakarta Sans', Arial, sans-serif; fill: #0f172a; }
      .sub { font: 500 11px 'Plus Jakarta Sans', Arial, sans-serif; fill: #475569; }
      .num { font: 800 14px 'Plus Jakarta Sans', Arial, sans-serif; fill: #ffffff; }
      .callout { stroke: #1e293b; stroke-width: 1.8; fill: none; }
      .badge { fill: #0f766e; stroke: #ffffff; stroke-width: 2; }
    </style>
  </defs>
  <rect width="600" height="360" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="300" y="28" text-anchor="middle" class="title">Percobaan Model Paru-Paru Sederhana</text>
  <text x="300" y="46" text-anchor="middle" class="sub">Perhatikan bagian 1, 2, 3, dan 4 ketika membran karet bagian bawah ditarik ke bawah</text>

  <!-- 3. Botol plastik keras -->
  <path d="M270,88 L270,115 L210,152 L210,285 L390,285 L390,152 L330,115 L330,88 Z"
        fill="#e0f2fe" fill-opacity="0.55" stroke="#0284c7" stroke-width="3"/>
  <!-- Sumbat gabus atas -->
  <rect x="272" y="84" width="56" height="16" rx="3" fill="#b45309" stroke="#78350f" stroke-width="1.5"/>

  <!-- 1. Sedotan Y (Trakea & Bronkus) -->
  <path d="M300,66 L300,158 M300,158 L266,184 M300,158 L334,184"
        fill="none" stroke="#f59e0b" stroke-width="8" stroke-linecap="round"/>

  <!-- 2. Dua Balon di dalam botol -->
  <path d="M266,184 C244,190 232,226 242,250 C252,268 278,262 282,238 C286,218 278,192 266,184 Z"
        fill="#fb7185" stroke="#be123c" stroke-width="2.2"/>
  <path d="M334,184 C356,190 368,226 358,250 C348,268 322,262 318,238 C314,218 322,192 334,184 Z"
        fill="#fb7185" stroke="#be123c" stroke-width="2.2"/>

  <!-- 4. Membran karet bawah ditarik ke bawah -->
  <path d="M210,285 Q300,322 390,285" fill="#fdba74" stroke="#c2410c" stroke-width="3"/>
  <line x1="300" y1="305" x2="300" y2="338" stroke="#c2410c" stroke-width="3.5"/>
  <polygon points="300,344 293,332 307,332" fill="#c2410c"/>

  <!-- Garis Penunjuk & Nomor -->
  <!-- 1: Sedotan Y -->
  <line x1="300" y1="130" x2="145" y2="112" class="callout"/>
  <circle cx="300" cy="130" r="3.5" fill="#1e293b"/>
  <circle cx="130" cy="112" r="15" class="badge"/>
  <text x="130" y="117" text-anchor="middle" class="num">1</text>

  <!-- 2: Dua balon -->
  <line x1="256" y1="226" x2="145" y2="215" class="callout"/>
  <circle cx="256" cy="226" r="3.5" fill="#1e293b"/>
  <circle cx="130" cy="215" r="15" class="badge"/>
  <text x="130" y="220" text-anchor="middle" class="num">2</text>

  <!-- 3: Botol plastik -->
  <line x1="390" y1="185" x2="465" y2="165" class="callout"/>
  <circle cx="390" cy="185" r="3.5" fill="#1e293b"/>
  <circle cx="480" cy="165" r="15" class="badge"/>
  <text x="480" y="170" text-anchor="middle" class="num">3</text>

  <!-- 4: Membran karet bawah -->
  <line x1="355" y1="298" x2="465" y2="298" class="callout"/>
  <circle cx="355" cy="298" r="3.5" fill="#1e293b"/>
  <circle cx="480" cy="298" r="15" class="badge"/>
  <text x="480" y="303" text-anchor="middle" class="num">4</text>
</svg>
