<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" width="640" height="500">
  <defs>
    <style>
      .title { font: 700 16px 'Plus Jakarta Sans', Arial, sans-serif; fill: #0f172a; }
      .sub { font: 500 11px 'Plus Jakarta Sans', Arial, sans-serif; fill: #475569; }
      .num { font: 800 14px 'Plus Jakarta Sans', Arial, sans-serif; fill: #ffffff; }
      .callout { stroke: #1e293b; stroke-width: 1.8; fill: none; }
      .badge { fill: #1d4ed8; stroke: #ffffff; stroke-width: 2; }
    </style>
  </defs>
  <rect width="640" height="500" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="320" y="30" text-anchor="middle" class="title">Sistem Pencernaan Manusia</text>
  <text x="320" y="48" text-anchor="middle" class="sub">Perhatikan nomor organ (1 s.d. 8) sesuai garis penunjuk</text>

  <!-- Siluet kepala & tubuh sederhana -->
  <path d="M245,80 C245,62 295,62 298,85 L302,115 C304,132 290,145 280,152 L280,170 C240,175 210,195 205,235 L195,435 L395,435 L385,235 C380,195 350,175 310,170 L310,150"
        fill="#fef3c7" fill-opacity="0.45" stroke="#d97706" stroke-width="2" stroke-opacity="0.4"/>

  <!-- 1. Rongga Mulut -->
  <path d="M250,115 C265,112 282,115 288,125 C280,134 260,134 252,126 Z" fill="#fca5a5" stroke="#b91c1c" stroke-width="2"/>
  <!-- 2. Kerongkongan (Esofagus) -->
  <path d="M282,128 C290,140 292,165 292,225 L304,225 C304,165 302,135 290,122 Z" fill="#fdba74" stroke="#c2410c" stroke-width="2"/>

  <!-- 4. Hati (Liver) - sisi kanan tubuh (kiri gambar) -->
  <path d="M225,222 C225,205 268,200 288,215 C292,232 260,256 228,250 C220,248 222,232 225,222 Z" fill="#991b1b" stroke="#7f1d1d" stroke-width="2"/>
  <!-- Kantung empedu kecil -->
  <ellipse cx="268" cy="248" rx="8" ry="5" fill="#16a34a" stroke="#14532d" stroke-width="1.5"/>

  <!-- 3. Lambung (Stomach) -->
  <path d="M298,223 C325,212 358,225 354,254 C350,278 320,288 296,278 C286,274 282,255 292,240 Z" fill="#fb923c" stroke="#9a3412" stroke-width="2.2"/>

  <!-- 5. Pankreas (di bawah lambung) -->
  <path d="M275,274 C295,268 332,272 342,282 C336,292 292,292 272,284 Z" fill="#fde047" stroke="#a16207" stroke-width="1.8"/>

  <!-- 7. Usus Besar (mengelilingi usus halus) -->
  <path d="M228,382 L228,302 C228,288 242,284 260,288 L335,288 C355,288 362,296 362,312 L362,385 C362,398 345,400 328,396 L305,396"
        fill="none" stroke="#a16207" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M228,382 L228,302 C228,288 242,284 260,288 L335,288 C355,288 362,296 362,312 L362,385 C362,398 345,400 328,396 L305,396"
        fill="none" stroke="#d97706" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10,4"/>

  <!-- 6. Usus Halus (berkelok di tengah) -->
  <path d="M252,312 C275,305 320,310 335,320 C342,328 258,330 255,340 C252,350 338,348 335,360 C332,372 256,368 258,380 C260,390 315,388 325,380"
        fill="none" stroke="#f472b6" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M252,312 C275,305 320,310 335,320 C342,328 258,330 255,340 C252,350 338,348 335,360 C332,372 256,368 258,380 C260,390 315,388 325,380"
        fill="none" stroke="#fbcfe8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 8. Rektum & Anus -->
  <path d="M305,396 C296,396 294,412 294,432" fill="none" stroke="#78350f" stroke-width="14" stroke-linecap="round"/>

  <!-- Garis Penunjuk & Nomor -->
  <!-- 1: Mulut -->
  <line x1="252" y1="120" x2="135" y2="112" class="callout"/>
  <circle cx="252" cy="120" r="3.5" fill="#1e293b"/>
  <circle cx="120" cy="112" r="15" class="badge"/>
  <text x="120" y="117" text-anchor="middle" class="num">1</text>

  <!-- 2: Kerongkongan -->
  <line x1="298" y1="172" x2="495" y2="148" class="callout"/>
  <circle cx="298" cy="172" r="3.5" fill="#1e293b"/>
  <circle cx="510" cy="148" r="15" class="badge"/>
  <text x="510" y="153" text-anchor="middle" class="num">2</text>

  <!-- 4: Hati -->
  <line x1="238" y1="226" x2="135" y2="215" class="callout"/>
  <circle cx="238" cy="226" r="3.5" fill="#1e293b"/>
  <circle cx="120" cy="215" r="15" class="badge"/>
  <text x="120" y="220" text-anchor="middle" class="num">4</text>

  <!-- 3: Lambung -->
  <line x1="342" y1="246" x2="495" y2="232" class="callout"/>
  <circle cx="342" cy="246" r="3.5" fill="#1e293b"/>
  <circle cx="510" cy="232" r="15" class="badge"/>
  <text x="510" y="237" text-anchor="middle" class="num">3</text>

  <!-- 5: Pankreas -->
  <line x1="335" y1="280" x2="495" y2="300" class="callout"/>
  <circle cx="335" cy="280" r="3.5" fill="#1e293b"/>
  <circle cx="510" cy="300" r="15" class="badge"/>
  <text x="510" y="305" text-anchor="middle" class="num">5</text>

  <!-- 7: Usus Besar -->
  <line x1="228" y1="338" x2="135" y2="338" class="callout"/>
  <circle cx="228" cy="338" r="3.5" fill="#1e293b"/>
  <circle cx="120" cy="338" r="15" class="badge"/>
  <text x="120" y="343" text-anchor="middle" class="num">7</text>

  <!-- 6: Usus Halus -->
  <line x1="322" y1="358" x2="495" y2="372" class="callout"/>
  <circle cx="322" cy="358" r="3.5" fill="#1e293b"/>
  <circle cx="510" cy="372" r="15" class="badge"/>
  <text x="510" y="377" text-anchor="middle" class="num">6</text>

  <!-- 8: Rektum / Anus -->
  <line x1="294" y1="422" x2="495" y2="435" class="callout"/>
  <circle cx="294" cy="422" r="3.5" fill="#1e293b"/>
  <circle cx="510" cy="435" r="15" class="badge"/>
  <text x="510" y="440" text-anchor="middle" class="num">8</text>
</svg>
